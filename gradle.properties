# Project-level Gradle settings. The daemon JVM args live HERE (not
# ~/.gradle/gradle.properties): project org.gradle.jvmargs wins over
# user-home, and the daemon needs the egress truststore + IPv4
# preference or its TLS-through-proxy connections reset (TOOLCHAIN.md
# §4: Java over IPv6 breaks CONNECT; the MITM CA rotates, rebuild the
# truststore per TOOLCHAIN.md §5 before a fresh checkout).
# NOTE for the push: these paths are VM-local; review before pushing
# to the public repo.
android.useAndroidX = true
org.gradle.jvmargs = -Xmx2048m -Djava.io.tmpdir=/home/hatch/.tmp-java -Djavax.net.ssl.trustStore=/home/hatch/tmp-java/egress-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djava.net.preferIPv4Stack=true
